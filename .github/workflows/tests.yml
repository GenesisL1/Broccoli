name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: dist/ is built from src/
        run: python3 tools/build.py --check
      - name: Install Playwright for Python and Chromium
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Browser tests (src/ and dist/)
        run: python3 tools/run_tests.py
