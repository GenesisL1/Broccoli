<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broccoli: PubMed in a few lines</title>
<style>
  :root { --bg: #f5f7f2; --fg: #1e2b22; --muted: #5d6b61; --line: #d5ddd2; --panel: #ffffff; --accent: #56795a; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141a16; --fg: #e3e9e2; --muted: #9aa79d; --line: #2c3730; --panel: #1b231e; --accent: #8fb592; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 60rem; margin: 0 auto; padding: 1.5rem max(16px, env(safe-area-inset-left, 0px)) 3rem max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  p { color: var(--muted); margin: 0 0 1rem; max-width: 42rem; }
  form { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
  input, button { font: inherit; padding: .45rem .7rem; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
  input { flex: 1 1 16rem; min-width: 0; }
  button { background: var(--accent); color: var(--bg); border-color: var(--accent); cursor: pointer; }
  #status { color: var(--muted); font-size: .875rem; min-height: 1.5em; }
  details { border-top: 1px solid var(--line); padding: .6rem 0; }
  summary { cursor: pointer; font-weight: 600; }
  summary small { color: var(--muted); font-weight: normal; }
  ol { margin: .5rem 0 0; padding-left: 1.5rem; }
  li { margin: .2rem 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>PubMed search, clustered</h1>
  <p>The smallest useful program with the library: search PubMed through NCBI E-utilities, fetch the records, cluster titles and abstracts, list the topics. Read the source of this page.</p>
  <form id="form">
    <input id="q" value="long covid fatigue" aria-label="PubMed query">
    <button>Search</button>
  </form>
  <div id="status"></div>
  <div id="out"></div>
</main>

<script src="../dist/broccoli.js"></script>
<script>
  var D = window.Broccoli;
  // tool and email identify your application to NCBI; an apiKey raises the limit from 3 to 10 requests a second.
  var pubmed = new D.PubMedClient({ tool: 'broccoli-example' /* , email: 'you@example.org', apiKey: '...' */ });
  var clusterer = D.createClusterer();

  async function run(query) {
    var status = document.getElementById('status');
    var out = document.getElementById('out');
    out.textContent = '';
    try {
      status.textContent = 'Searching PubMed…';
      var search = await pubmed.search(query, { retmax: 300 });
      status.textContent = 'Fetching ' + search.ids.length + ' of ' + search.count + ' records…';
      var articles = await pubmed.fetchArticles(search.ids, {
        onProgress: function (done, total) { status.textContent = 'Fetched ' + done + ' of ' + total + ' records…'; }
      });
      status.textContent = 'Clustering…';
      var result = await clusterer.cluster(D.toDocuments(articles), {
        algorithm: 'lingo',
        preset: 'abstracts',      // biomedical stop words and labels, NMF factorization
        queryHint: query,
        fields: ['title', 'abstract']
      });
      status.textContent = articles.length + ' records, ' + (result.clusters.length) + ' topics, clustered in ' + result.timings.total + ' ms';
      result.clusters.forEach(function (c) {
        var details = document.createElement('details');
        var summary = document.createElement('summary');
        summary.textContent = c.label + ' ';
        var small = document.createElement('small');
        small.textContent = c.size + ' records';
        summary.appendChild(small);
        var ol = document.createElement('ol');
        c.documents.forEach(function (i) {
          var a = articles[i];
          var li = document.createElement('li');
          var link = document.createElement('a');
          link.href = a.url;
          link.target = '_blank';
          link.rel = 'noopener';
          link.textContent = a.title;
          li.appendChild(link);
          li.appendChild(document.createTextNode(' ' + (a.journal.isoAbbreviation || '') + ' ' + (a.year || '')));
          ol.appendChild(li);
        });
        details.appendChild(summary);
        details.appendChild(ol);
        out.appendChild(details);
      });
    } catch (err) {
      status.textContent = err.message;
    }
  }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    run(document.getElementById('q').value);
  });
</script>
</body>
</html>
