<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broccoli: any search, clustered</title>
<style>
  :root { --bg: #f5f7f2; --fg: #1e2b22; --muted: #5d6b61; --line: #d5ddd2; --panel: #ffffff; --accent: #56795a; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141a16; --fg: #e3e9e2; --muted: #9aa79d; --line: #2c3730; --panel: #1b231e; --accent: #8fb592; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 60rem; margin: 0 auto; padding: 1.5rem max(16px, env(safe-area-inset-left, 0px)) 3rem max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  p { color: var(--muted); margin: 0 0 1rem; max-width: 42rem; }
  form { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
  input, select, button { font: inherit; padding: .45rem .7rem; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
  input { flex: 1 1 16rem; min-width: 0; }
  button { background: var(--accent); color: var(--bg); border-color: var(--accent); cursor: pointer; }
  #status { color: var(--muted); font-size: .875rem; min-height: 1.5em; }
  details { border-top: 1px solid var(--line); padding: .6rem 0; }
  summary { cursor: pointer; font-weight: 600; }
  summary small { color: var(--muted); font-weight: normal; }
  ol { margin: .5rem 0 0; padding-left: 1.5rem; }
  li { margin: .2rem 0; }
  li small { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Any search, clustered</h1>
  <p>Pick a source, search it, and read the results as topics: the library's search sources with a dozen lines of code around them. Read the source of this page.</p>
  <form id="form">
    <select id="source" aria-label="Source"></select>
    <input id="q" value="graph neural networks" aria-label="Query">
    <button>Search</button>
  </form>
  <div id="status"></div>
  <div id="out"></div>
</main>

<script src="../dist/broccoli.js"></script>
<script>
  var D = window.Broccoli;

  // A source of your own takes a few lines. This one is a stub that answers
  // from memory; point the url of a jsonSource at a real JSON API instead:
  //   D.registerSource(D.jsonSource({ id: 'mine', name: 'My index',
  //     url: 'https://example.org/api?q={query}&size={size}&from={offset}',
  //     results: 'items', total: 'total', fields: { id: 'id', title: 'title', abstract: 'summary', url: 'link' } }));
  D.registerSource({
    id: 'notes', name: 'My notes (an example source)', group: 'Your sources',
    async fetchPage(req) {
      var notes = [
        { id: 'n1', title: 'Jaguar sightings in the Pantanal', abstract: 'Camera traps recorded jaguars near the river.' },
        { id: 'n2', title: 'Jaguar electric car range test', abstract: 'The electric grand tourer drove 700 km.' },
        { id: 'n3', title: 'Counting jaguars with camera traps', abstract: 'Camera traps and spot patterns identify each jaguar.' },
        { id: 'n4', title: 'Charging the electric Jaguar', abstract: 'Fast charging adds 300 km of range in 20 minutes.' },
      ];
      return { total: notes.length, records: notes };
    },
  });

  var select = document.getElementById('source');
  D.listSources().filter(function (s) { return s.browser; }).forEach(function (s) {
    var o = document.createElement('option');
    o.value = s.id;
    o.textContent = s.name;
    select.appendChild(o);
  });
  select.value = 'arxiv';
  select.addEventListener('change', function () {
    var s = D.getSource(select.value);
    if (s.examples.length) document.getElementById('q').value = s.examples[0].query;
  });

  var clusterer = D.createClusterer();

  async function run(sourceId, query) {
    var status = document.getElementById('status');
    var out = document.getElementById('out');
    out.textContent = '';
    try {
      var source = D.getSource(sourceId);
      status.textContent = 'Searching ' + source.name + '…';
      var res = await D.searchSource(sourceId, query, {
        limit: 200,
        onProgress: function (done, total) { status.textContent = 'Fetched ' + done + ' of ' + total + ' records…'; },
        // settings: { apiKey: '…' }   ← the source's own settings, such as an OpenAlex key
      });
      status.textContent = 'Clustering…';
      var result = await clusterer.cluster(D.toDocuments(res.records), {
        algorithm: 'lingo',
        preset: 'abstracts',
        language: res.language || 'en',
        queryHint: query,
        fields: ['title', 'abstract'],
      });
      status.textContent = res.records.length + ' of ' + res.total + ' records from ' + res.name + ', ' + result.clusters.length + ' topics, clustered in ' + result.timings.total + ' ms';
      result.clusters.forEach(function (c) {
        var details = document.createElement('details');
        var summary = document.createElement('summary');
        summary.textContent = c.label + ' ';
        var small = document.createElement('small');
        small.textContent = c.size + ' records';
        summary.appendChild(small);
        var ol = document.createElement('ol');
        c.documents.forEach(function (i) {
          var r = res.records[i];
          var li = document.createElement('li');
          var link = document.createElement(r.url ? 'a' : 'span');
          if (r.url) { link.href = r.url; link.target = '_blank'; link.rel = 'noopener'; }
          link.textContent = r.title;
          li.appendChild(link);
          var meta = document.createElement('small');
          meta.textContent = ' ' + [r.journal.title || r.publisher, r.year].filter(Boolean).join(', ');
          li.appendChild(meta);
          ol.appendChild(li);
        });
        details.appendChild(summary);
        details.appendChild(ol);
        out.appendChild(details);
      });
    } catch (err) {
      status.textContent = err.message + (err.kind ? ' (' + err.kind + ')' : '');
    }
  }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    run(select.value, document.getElementById('q').value);
  });
</script>
</body>
</html>
